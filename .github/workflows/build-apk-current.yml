name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete old artifacts (keep latest 3)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          ids=$(gh api --paginate "repos/$repo/actions/artifacts" -q '.artifacts[].id')
          total=$(echo "$ids" | grep -c . || true)
          echo "artifact count: $total"
          # API returns newest first; keep the latest 3, delete the rest
          echo "$ids" | tail -n +4 | while read id; do
            [ -n "$id" ] && gh api -X DELETE "repos/$repo/actions/artifacts/$id" >/dev/null 2>&1 && echo "deleted $id"
          done

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name my_stream_player .

      - name: Patch app label and package id
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="音素音乐"|' "$f"
          # Newer Flutter templates use build.gradle.kts, older use build.gradle.
          g=android/app/build.gradle
          if [ -f "$g" ]; then
            sed -i -E 's|applicationId[ =]*"[^"]*"|applicationId "cn.yinsu.x_music"|' "$g"
          fi
          g=android/app/build.gradle.kts
          if [ -f "$g" ]; then
            sed -i -E 's|applicationId[ =]*"[^"]*"|applicationId = "cn.yinsu.x_music"|' "$g"
          fi
          grep -n "android:label" "$f"
          grep -rn "applicationId" android/app/build.gradle* || true

      - name: Patch AndroidManifest (network + 车机媒体识别)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <application android:usesCleartextTraffic="true" android:requestLegacyExternalStorage="true"|' "$f"
          # 车机媒体识别：声明音乐应用 category + MUSIC_PLAYER action（迪友等车机桌面按此枚举音乐播放器）
          sed -i 's|<category android:name="android.intent.category.LAUNCHER"/>|<category android:name="android.intent.category.LAUNCHER"/>\n            <category android:name="android.intent.category.APP_MUSIC"/>\n            <category android:name="com.android.launcher.category.APP_MUSIC"/>\n            <action android:name="android.intent.action.MUSIC_PLAYER"/>|' "$f"
          grep -n "INTERNET\|FOREGROUND_SERVICE\|MANAGE_EXTERNAL_STORAGE\|requestLegacyExternalStorage\|APP_MUSIC\|MUSIC_PLAYER" "$f"

      - name: Patch audio service (audio + lyric overlay)
        run: |
          python3 <<'PYEOF'
          import glob, os, shutil
          matches = glob.glob("android/app/src/main/kotlin/**/MainActivity.kt", recursive=True)
          ma = matches[0] if matches else None
          if not ma:
              print("WARNING: MainActivity.kt not found!")
              print(glob.glob("android/app/src/main/**/*.kt", recursive=True))
          else:
              pk = ma.replace("android/app/src/main/kotlin/", "").replace("/MainActivity.kt", "").replace("/", ".")
              kdir = os.path.dirname(ma)
              # 歌词浮窗原生服务（双前台检测：无障碍 + UsageStats）
              for name in ["LyricOverlayService.kt", "LyricAccessibilityService.kt"]:
                  src = os.path.join("android_overlay", name)
                  dst = os.path.join(kdir, name)
                  open(dst, "w").write(open(src).read().replace("__PKG__", pk))
                  print("Wrote " + dst)
              # MainActivity 带 lyric_overlay MethodChannel
              ma_data = open("android_overlay/MainActivity.kt").read().replace("__PKG__", pk)
              open(ma, "w").write(ma_data)
              print("Wrote MainActivity with lyric overlay channel")
              print(open(ma).read())
              # 无障碍配置 xml
              os.makedirs("android/app/src/main/res/xml", exist_ok=True)
              shutil.copy("android_overlay/lyric_accessibility_config.xml", "android/app/src/main/res/xml/lyric_accessibility_config.xml")
              # 无障碍描述字符串
              desc = '    <string name="lyric_accessibility_desc">识别当前前台是否为车机桌面，决定歌词悬浮窗是否显示</string>'
              vals = glob.glob("android/app/src/main/res/values*/strings.xml")
              if vals:
                  sp = vals[0]; s = open(sp).read()
                  if 'lyric_accessibility_desc' not in s:
                      s = s.replace('</resources>', desc + '\n</resources>')
                      open(sp, "w").write(s)
              else:
                  os.makedirs("android/app/src/main/res/values", exist_ok=True)
                  open("android/app/src/main/res/values/strings.xml", "w").write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n' + desc + '\n</resources>\n')
              # manifest：权限 + 服务
              p = "android/app/src/main/AndroidManifest.xml"
              s = open(p).read()
              if 'xmlns:tools' not in s:
                  s = s.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
              for perm in ['SYSTEM_ALERT_WINDOW', 'PACKAGE_USAGE_STATS', 'FOREGROUND_SERVICE_SPECIAL_USE']:
                  if ('android.permission.' + perm) not in s:
                      s = s.replace('<application', '<uses-permission android:name="android.permission.' + perm + '" tools:ignore="ProtectedPermissions"/>\n    <application', 1)
              if 'AudioService' not in s:
                  svc = '\n      <service android:name="com.ryanheise.audioservice.AudioService" android:foregroundServiceType="mediaPlayback" android:exported="true" tools:ignore="Instantiatable">\n        <intent-filter>\n          <action android:name="android.media.browse.MediaBrowserService" />\n        </intent-filter>\n      </service>\n      <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver" android:exported="true" tools:ignore="Instantiatable">\n        <intent-filter>\n          <action android:name="android.intent.action.MEDIA_BUTTON" />\n        </intent-filter>\n      </receiver>\n  </application>'
                  s = s.replace('</application>', svc)
              if 'LyricOverlayService' not in s:
                  extra = '\n      <service android:name=".LyricOverlayService" android:exported="false" android:foregroundServiceType="specialUse">\n        <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="lyric_overlay"/>\n      </service>\n      <service android:name=".LyricAccessibilityService" android:exported="false" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:label="音素音乐歌词悬浮窗">\n        <intent-filter>\n          <action android:name="android.accessibilityservice.AccessibilityService"/>\n        </intent-filter>\n        <meta-data android:name="android.accessibilityservice" android:resource="@xml/lyric_accessibility_config"/>\n      </service>\n  </application>'
                  s = s.replace('</application>', extra)
              open(p, "w").write(s)
              print("=== MANIFEST ===")
              print(open(p).read())
              print("=== END ===")
          PYEOF

      - name: Generate app icons
        run: |
          # Drop any adaptive-icon xml from the template so our PNGs are used.
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          python -m pip install pillow --quiet
          python - <<'EOF'
          from PIL import Image, ImageDraw
          import os
          src = Image.open('assets/app_icon.png').convert('RGBA')
          # Round the corners so the icon looks clean on any launcher.
          mask = Image.new('L', src.size, 0)
          d = ImageDraw.Draw(mask)
          r = int(src.size[0] * 0.22)
          d.rounded_rectangle([0, 0, src.size[0] - 1, src.size[1] - 1],
                              radius=r, fill=255)
          src.putalpha(mask)
          sizes = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96,
                   'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          for d, s in sizes.items():
              p = os.path.join('android/app/src/main/res', d)
              os.makedirs(p, exist_ok=True)
              img = src.resize((s, s), Image.LANCZOS)
              img.save(os.path.join(p, 'ic_launcher.png'))
              img.save(os.path.join(p, 'ic_launcher_round.png'))
          print('icons generated')
          EOF

      - name: Sync version string
        run: |
          echo "const String appVersion = '0.4.${{ github.run_number }}';" > lib/app_version.dart
          cat lib/app_version.dart

      - name: Transparent window background
        run: |
          python3 <<'PYEOF'
          import glob
          # Find styles.xml and set transparent window background
          for p in glob.glob("android/app/src/main/res/values*/styles.xml"):
              s = open(p).read()
              if 'windowBackground' not in s:
                  s = s.replace('</style>', '<item name="android:windowBackground">@android:color/transparent</item>\n    </style>')
              if 'windowIsTranslucent' not in s:
                  s = s.replace('</style>', '<item name="android:windowIsTranslucent">true</item>\n    </style>')
              open(p, "w").write(s)
              print("Patched " + p)
          # Also create drawable transparent bg
          import os
          os.makedirs("android/app/src/main/res/drawable", exist_ok=True)
          with open("android/app/src/main/res/drawable/transparent_bg.xml", "w") as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<shape xmlns:android="http://schemas.android.com/apk/res/android">\n    <solid android:color="@android:color/transparent"/>\n</shape>')
          print("Created transparent_bg.xml")
          PYEOF

      - run: flutter pub get
      - name: Disable release lint fatal
        run: |
          f=android/app/build.gradle
          [ -f "$f" ] || f=android/app/build.gradle.kts
          if [[ "$f" == *.kts ]]; then
            sed -i 's|android {|android {\n  lint { checkReleaseBuilds = false; abortOnError = false }|' "$f"
          else
            sed -i 's|android {|android {\n    lintOptions { checkReleaseBuilds false; abortOnError false }|' "$f"
          fi
          grep -n lint "$f"
      - run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=0.4.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: my-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.4.${{ github.run_number }}"
          gh release create "$tag" build/app/outputs/flutter-apk/app-release.apk \
            --title "音素音乐 0.4.${{ github.run_number }}" --notes "自动构建" 2>/dev/null || \
          gh release upload "$tag" build/app/outputs/flutter-apk/app-release.apk --clobber